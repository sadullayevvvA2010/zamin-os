        <div class="global-search">
          <input type="text" id="globalSearch" data-i18n="search_placeholder" placeholder="Qidiruv: buyurtma, mahsulot, mijoz..." />
        </div>
        <div class="topbar-right">
          <button id="themeToggle" class="icon-btn" title="Tungi/Kunduzgi rejim">🌙</button>

            <button type="button" class="lang-btn" data-lang="ru">RU</button>

          <div class="demo-badge" data-i18n="demo_badge">DEMO</div>
          <div class="user-info">

            <div class="user-meta">
              <span id="userName">Admin</span>
              <small id="userRole">Bosh administrator</small>

  <script>
    const db = DB.get();
    if (!db.session) {
      db.session = { userId: 1, loginAt: new Date().toISOString() };
      DB.save(db);
    }
  </script>
